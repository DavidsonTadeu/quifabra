<script type="module">
  import { db, collection, getDocs, query, where } from './js/firebase-config.js';
  
  async function loadProducts() {
    const productsGrid = document.getElementById('productsGrid');
    if(!productsGrid) return;
    
    try {
      const q = query(collection(db, "products"), where("status", "==", "Ativo"));
      const querySnapshot = await getDocs(q);
      
      const loadingEl = document.getElementById('dynamic-products-loading');
      if (loadingEl) loadingEl.remove();

      if (querySnapshot.empty) {
        productsGrid.innerHTML = '<div style="padding:40px;width:100%;text-align:center;">Nenhum produto cadastrado no momento.</div>';
        return;
      }

      let html = '';
      querySnapshot.forEach((docSnap) => {
        const p = docSnap.data();
        let priceHtml = '';
        if (p.promo_price && Number(p.promo_price) > 0 && Number(p.promo_price) < Number(p.price)) {
          priceHtml = `<div style="margin-top:8px; font-weight:700; color:#10B981; font-size:1.1rem;">R$ ${Number(p.promo_price).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>`;
        } else {
          priceHtml = `<div style="margin-top:8px; font-weight:700; color:var(--color-brand); font-size:1.1rem;">R$ ${Number(p.price).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>`;
        }
        
        const freteBadge = p.frete_gratis ? `<div style="position: absolute; top: 12px; left: 12px; z-index: 2; background: #00a650; color: white; padding: 4px 10px; border-radius: 8px; font-size: .7rem; font-weight: 800;">🚚 FRETE GRÁTIS</div>` : '';

        html += `
          <a href="produto.html?id=${docSnap.id}" class="carousel-card" aria-label="Ver ${p.title}" style="position: relative;">
            ${freteBadge}
            <div class="carousel-card__thumb">
              <img src="${p.image_url}" alt="${p.title}" loading="lazy" />
              <div class="carousel-card__overlay">
                <span>Ver Detalhes →</span>
              </div>
            </div>
            <div class="carousel-card__body">
              <span class="carousel-card__tag">${p.category || 'Categoria'}</span>
              <h3 class="carousel-card__title">${p.title}</h3>
              <p class="carousel-card__desc">${p.desc_short || ''}</p>
              ${priceHtml}
            </div>
          </a>
        `;
      });
      
      // Apenas injeta os produtos na grid
      productsGrid.innerHTML = html;
      
    } catch(e) {
      console.error("Erro ao carregar produtos:", e);
    }
  }

  document.addEventListener('DOMContentLoaded', loadProducts);
</script>
